[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mnerys-cli"
version = "0.1.0"
description = "Mnerys command line client: authenticated turns against the shared Gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Yuri Cunha", email = "isyuricunha@duck.com" }]
keywords = ["mnerys", "ai", "gateway", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
mnerys = "mnerys_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mnerys_cli"]

[tool.hatch.build.targets.sdist]
include = ["mnerys_cli", "README.md", "LICENSE"]