[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "mnerys-cli"
dynamic = ["version"]
description = "Mnerys command line client: authenticated turns against the shared Gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Yuri Cunha", email = "isyuricunha@duck.com" }]
keywords = ["mnerys", "ai", "gateway", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
mnerys = "mnerys_cli.cli:main"

[project.optional-dependencies]
# The interactive TUI extra: a terminal application dependency, never a
# runtime requirement of the remote-only base install.
tui = ["textual>=8.2.8,<9"]

# One unified release version: semantic-release Git tags (vX.Y.Z) are the
# authoritative source and the distribution derives its version from them.
[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[tool.hatch.version.raw-options]
# The package lives in a monorepo subdirectory; the release tags point at
# the repository root. Without a fallback, builds without Git metadata or
# PKG-INFO fail loudly instead of inventing a version.
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["mnerys_cli"]

[tool.hatch.build.targets.sdist]
include = ["mnerys_cli", "README.md", "LICENSE"]
