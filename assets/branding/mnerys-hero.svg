<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Mnerys — Built to be yours</title>
  <desc id="desc">Brand illustration with agents, models, tools, and knowledge connected to a customizable workspace. This is an illustration, not a screenshot of the application.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110E0D"/>
      <stop offset=".55" stop-color="#15110F"/>
      <stop offset="1" stop-color="#241A16"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8AF98"/>
      <stop offset=".65" stop-color="#CC785C"/>
      <stop offset="1" stop-color="#DF997B"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#CC785C" stop-opacity=".29"/>
      <stop offset=".65" stop-color="#CC785C" stop-opacity=".07"/>
      <stop offset="1" stop-color="#CC785C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="39" height="39" patternUnits="userSpaceOnUse">
      <path d="M39 0H0V39" stroke="#F0D2C5" stroke-opacity=".048" fill="none"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1280" height="520" rx="26" fill="url(#background)"/>
  <rect width="1280" height="520" rx="26" fill="url(#grid)"/>
  <circle cx="970" cy="260" r="305" fill="url(#halo)"/>
  <circle cx="1120" cy="90" r="100" fill="#CC785C" opacity=".08" filter="url(#blur)"/>
  <path d="M68 446 H515" stroke="#AC715B" stroke-opacity=".27" stroke-width="1"/>
  <g fill="#E7B199" opacity=".72">
    <circle cx="78" cy="80" r="1.4"/><circle cx="548" cy="94" r="2"/><circle cx="615" cy="390" r="1.5"/>
    <circle cx="1210" cy="72" r="1.9"/><circle cx="1154" cy="438" r="1.3"/><circle cx="746" cy="50" r="1.8"/>
  </g>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="90" y="117" fill="#E0A38D" font-size="15" letter-spacing="3" font-weight="700">SELF-HOSTED  /  OPEN SOURCE</text>
    <text x="86" y="205" fill="#FFFFFF" font-size="62" font-weight="650" letter-spacing="-2.8">Your workspace.</text>
    <text x="86" y="275" fill="url(#brand)" font-size="62" font-weight="650" letter-spacing="-2.8">Your rules.</text>
    <text x="90" y="338" fill="#BFA79B" font-size="20">Agents, knowledge, models and tools.</text>
    <text x="90" y="373" fill="#BFA79B" font-size="20">Connected around the way you work.</text>
    <rect x="90" y="411" width="194" height="3" rx="2" fill="url(#brand)"/>
    <text x="90" y="474" fill="#B99C8E" font-size="14" letter-spacing="1.7">mnerys  •  BUILT TO BE YOURS</text>
  </g>
  <!-- An abstract constellation of capabilities, not a product screenshot. -->
  <g stroke="#D38C6D" fill="none" stroke-width="1.7" stroke-opacity=".43">
    <path d="M907 227 L802 138"/>
    <path d="M1029 220 L1136 136"/>
    <path d="M901 326 L798 400"/>
    <path d="M1032 327 L1128 408"/>
    <path d="M970 191 L970 106" stroke-dasharray="4 8"/>
    <path d="M968 356 L968 440" stroke-dasharray="4 8"/>
    <circle cx="970" cy="261" r="164" stroke-dasharray="3 12" stroke-opacity=".23"/>
    <circle cx="970" cy="261" r="216" stroke-opacity=".12"/>
  </g>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <g>
      <rect x="711" y="90" width="176" height="70" rx="17" fill="#211915" stroke="#594238" stroke-opacity=".85"/>
      <circle cx="739" cy="124" r="9" fill="#C97856" fill-opacity=".25" stroke="#CC785C"/>
      <path d="M736 124h6M739 121v6" stroke="#F0D2C5" stroke-width="1.5"/>
      <text x="761" y="132" font-size="19" fill="#F3E8E2" font-weight="550">Agents</text>
    </g>
    <g>
      <rect x="1061" y="90" width="165" height="70" rx="17" fill="#211915" stroke="#594238" stroke-opacity=".85"/>
      <circle cx="1090" cy="124" r="9" fill="#DBA78B" fill-opacity=".2" stroke="#DBA78B"/>
      <path d="M1086 124h8M1090 120v8" stroke="#FFE1CD" stroke-width="1.5"/>
      <text x="1112" y="132" font-size="19" fill="#F3E8E2" font-weight="550">Models</text>
    </g>
    <g>
      <rect x="700" y="367" width="179" height="70" rx="17" fill="#211915" stroke="#594238" stroke-opacity=".85"/>
      <circle cx="728" cy="402" r="9" fill="#DBA78B" fill-opacity=".2" stroke="#DBA78B"/>
      <path d="M724 402h8M728 398v8" stroke="#FFE1CD" stroke-width="1.5"/>
      <text x="750" y="410" font-size="19" fill="#F3E8E2" font-weight="550">Knowledge</text>
    </g>
    <g>
      <rect x="1077" y="367" width="141" height="70" rx="17" fill="#211915" stroke="#594238" stroke-opacity=".85"/>
      <circle cx="1105" cy="402" r="9" fill="#C97856" fill-opacity=".25" stroke="#CC785C"/>
      <path d="M1101 402h8M1105 398v8" stroke="#F0D2C5" stroke-width="1.5"/>
      <text x="1127" y="410" font-size="19" fill="#F3E8E2" font-weight="550">Tools</text>
    </g>
    <g>
      <rect x="870" y="194" width="206" height="140" rx="24" fill="#2A211D" stroke="#CC785C" stroke-width="1.8"/>
      <rect x="881" y="205" width="184" height="118" rx="18" fill="#3A2C26" opacity=".6"/>
      <circle cx="972" cy="252" r="34" fill="#CC785C" opacity=".12"/>
      <path d="M945 271 953 229 970 249 987 229 995 271" fill="none" stroke="url(#brand)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="970" cy="252" r="4" fill="#FFFFFF"/>
      <text x="970" y="308" font-size="16" fill="#F3E8E2" letter-spacing="3" text-anchor="middle" font-weight="650">mnerys</text>
    </g>
  </g>
</svg>
