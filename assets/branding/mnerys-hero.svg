      <circle cx="739" cy="124" r="9" fill="#9F90FF" fill-opacity=".25" stroke="#A99CFD"/>
      <path d="M736 124h6M739 121v6" stroke="#DFD7FF" stroke-width="1.5"/>
      <text x="761" y="132" font-size="19" fill="#E9E7FF" font-weight="550">Agents</text>
    </g>
    <g>
      <rect x="1061" y="90" width="165" height="70" rx="17" fill="#171B34" stroke="#575585" stroke-opacity=".85"/>
      <circle cx="1090" cy="124" r="9" fill="#6BD1EB" fill-opacity=".2" stroke="#6BD1EB"/>
      <path d="M1086 124h8M1090 120v8" stroke="#B8F0FB" stroke-width="1.5"/>
      <text x="1112" y="132" font-size="19" fill="#E9E7FF" font-weight="550">Models</text>
    </g>
    <g>
      <rect x="700" y="367" width="179" height="70" rx="17" fill="#171B34" stroke="#575585" stroke-opacity=".85"/>
      <circle cx="728" cy="402" r="9" fill="#6BD1EB" fill-opacity=".2" stroke="#6BD1EB"/>
      <path d="M724 402h8M728 398v8" stroke="#B8F0FB" stroke-width="1.5"/>
      <text x="750" y="410" font-size="19" fill="#E9E7FF" font-weight="550">Knowledge</text>
    </g>
    <g>
      <rect x="1077" y="367" width="141" height="70" rx="17" fill="#171B34" stroke="#575585" stroke-opacity=".85"/>
      <circle cx="1105" cy="402" r="9" fill="#9F90FF" fill-opacity=".25" stroke="#A99CFD"/>
      <path d="M1101 402h8M1105 398v8" stroke="#DFD7FF" stroke-width="1.5"/>
      <text x="1127" y="410" font-size="19" fill="#E9E7FF" font-weight="550">Tools</text>
    </g>
    <g>
      <rect x="870" y="194" width="206" height="140" rx="24" fill="#1D1B3A" stroke="#9587F4" stroke-width="1.8"/>
      <rect x="881" y="205" width="184" height="118" rx="18" fill="#231F47" opacity=".6"/>
      <circle cx="972" cy="252" r="34" fill="#8172DA" opacity=".12"/>
      <path d="M970 219 L976 245 L1002 252 L976 259 L970 285 L964 259 L938 252 L964 245Z" fill="url(#brand)"/>
      <circle cx="970" cy="252" r="4" fill="#FFFFFF"/>
      <text x="970" y="308" font-size="16" fill="#F1EDFF" letter-spacing="3" text-anchor="middle" font-weight="650">mnerys</text>
    </g>
  </g>
