name: Build and publish Mnerys containers

# Only a successful CI-gated release may publish stable image tags.
# The reusable workflow is called by release.yml because tags created by
# GITHUB_TOKEN do not themselves trigger tag-push workflows.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Trusted, published version tag (e.g. v0.1.0)
        required: true
        type: string
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'assets/branding/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out published version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Determine source version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            version="${RELEASE_TAG#v}"
          else
            version="0.1.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Normalize image name
        shell: bash
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          platforms: ${{ matrix.platform }}
          build-args: |
            MNERYS_RELEASE_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${BUILD_DIGEST#sha256:}"
      - name: Upload architecture digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests and publish version tags
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out published version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Validate released version and compute tags
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || exit 1
            echo "series=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Normalize image name
        shell: bash
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Download architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute registry tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=${{ steps.version.outputs.series }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=latest,enable=${{ inputs.release_tag != '' }}
            type=raw,value=${{ inputs.release_tag }}-${{ steps.version.outputs.short }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=dev,enable=${{ inputs.release_tag == '' }}
            type=raw,value=dev-${{ steps.version.outputs.short }},enable=${{ inputs.release_tag == '' }}
      - name: Create multiarch manifest and push tags
        shell: bash
        working-directory: /tmp/digests
        env:
          DOCKER_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_TAGS_JSON")
          (( ${#tags[@]} > 0 ))
          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done
          shopt -s nullglob
          digests=(*)
          (( ${#digests[@]} == 2 ))
          for digest in "${digests[@]}"; do
            args+=("${REGISTRY}/${IMAGE_NAME}@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
      - name: Verify published manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          SERIES: ${{ steps.version.outputs.series }}
          SHORT: ${{ steps.version.outputs.short }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            refs=("$RELEASE_TAG" "$SERIES" "latest" "$RELEASE_TAG-$SHORT")
          else
            refs=("dev" "dev-$SHORT")
          fi
          for tag in "${refs[@]}"; do
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:$tag"
          done
