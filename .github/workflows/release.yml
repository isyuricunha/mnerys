name: Release (semantic-release)

# Publish only after the complete blocking CI succeeds on a trusted main push.
# A workflow_run with write permissions must never consume PR artifacts.
on:
  # zizmor: ignore[dangerous-triggers] Intentional privileged handoff: the job accepts only successful same-repo main push CI, rechecks its exact HEAD SHA and consumes no CI artifacts.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: mnerys-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified Mnerys release
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI commit is still main HEAD
        id: gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          main_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_head" != "$EXPECTED_SHA" ]]; then
            echo 'A newer commit is on main; only that commit may publish.'
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Set up stable Node.js
        if: steps.gate.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.2'
          cache: npm

      - name: Install locked release tooling
        if: steps.gate.outputs.current == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bootstrap 0.1.0 or run semantic-release
        id: publish
        if: steps.gate.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch origin --tags
          mapfile -t prior_tags < <(git tag --points-at "$RELEASE_SHA" --list 'v[0-9]*')
          if ! git tag --list 'v[0-9]*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            # semantic-release does not support an initial 0.x release.
            test -s docs/releases/0.1.0.md
            gh release create v0.1.0 \
              --target "$RELEASE_SHA" \
              --title "Mnerys v0.1.0" \
              --notes-file docs/releases/0.1.0.md
          else
            npx --no-install semantic-release
          fi

          # GITHUB_TOKEN-created tags do not trigger push workflows.
          # Return only a tag newly created by this run for reusable image jobs.
          git fetch origin --tags
          release_tag=""
          while IFS= read -r candidate; do
            [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            already_present=false
            for prior in "${prior_tags[@]}"; do
              if [[ "$prior" == "$candidate" ]]; then
                already_present=true
                break
              fi
            done
            if [[ "$already_present" == false ]]; then
              release_tag="$candidate"
            fi
          done < <(git tag --points-at "$RELEASE_SHA" --list 'v[0-9]*' | sort -V)

          if [[ -n "$release_tag" ]]; then
            gh release view "$release_tag" --json tagName --jq .tagName > /dev/null
            echo "Published $release_tag"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          else
            echo 'No new release required.'
          fi

  images:
    name: Publish release containers
    needs: release
    if: needs.release.outputs.release_tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}

  cli-package:
    name: Publish the mnerys-cli wheel and sdist
    needs: release
    if: needs.release.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The ref is safe: it is the tag this same run detected on the exact
      # validated main HEAD (strict vX.Y.Z match in the release job), never
      # attacker-controlled event payload data.
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python for the verification script
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the pinned uv build tool
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"

      - name: Build the wheel and sdist from the release tag
        run: uv build --out-dir "$RUNNER_TEMP/dist" packages/mnerys-cli

      - name: Verify distribution metadata against the release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          python scripts/verify_cli_release.py \
            --tag "$RELEASE_TAG" \
            --dist-dir "$RUNNER_TEMP/dist" \
            --require-sdist

      - name: Install the wheel in a fresh environment and verify the CLI version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv-check"
          "$RUNNER_TEMP/venv-check/bin/pip" install --no-deps \
            "$RUNNER_TEMP"/dist/mnerys_cli-*.whl
          reported="$("$RUNNER_TEMP/venv-check/bin/mnerys" --version)"
          echo "installed CLI reports: $reported"
          test "$reported" = "mnerys ${RELEASE_TAG#v}"

      - name: Rebuild the wheel from the sdist without Git metadata
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdist-tree" "$RUNNER_TEMP/sdist-dist"
          tar -xzf "$RUNNER_TEMP"/dist/mnerys_cli-*.tar.gz \
            -C "$RUNNER_TEMP/sdist-tree" --strip-components=1
          test ! -e "$RUNNER_TEMP/sdist-tree/.git"
          (cd "$RUNNER_TEMP/sdist-tree" && uv build --wheel --out-dir "$RUNNER_TEMP/sdist-dist")
          python scripts/verify_cli_release.py \
            --tag "$RELEASE_TAG" \
            --dist-dir "$RUNNER_TEMP/sdist-dist"

      - name: Attach the distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP"/dist/mnerys_cli-*.whl \
            "$RUNNER_TEMP"/dist/mnerys_cli-*.tar.gz \
            --clobber
          echo 'Release assets now:'
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
